[project]
name = "fuli-ai-assistant"
version = "0.1.0"
description = "Fuli — MCP server & AI voice assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "python-dotenv",
]

[project.scripts]
fuli = "server:main"
fuli_voice = "agent_fuli:dev"
start = "run_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]

[tool.pyright]
venvPath = "."
venv = ".venv"
